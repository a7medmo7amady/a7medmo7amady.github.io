<nav [class.scrolled]="true">
  <div class="nav-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">Ahmad<span>.</span></a>

    <ul class="nav-links">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          >{{ link.label }}</a>
        </li>
      }
    </ul>

    <button class="burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <span></span><span></span><span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <ul class="mobile-menu">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMenu()"
          >{{ link.label }}</a>
        </li>
      }
    </ul>
  }
</nav>
