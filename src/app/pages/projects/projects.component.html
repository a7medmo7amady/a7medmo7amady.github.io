<div class="section page-enter">
  <h1 class="section-title reveal" #reveal>My <span class="gradient-text">Projects</span></h1>
  <p class="section-sub reveal delay-1" #reveal>Things I've built</p>

  <div class="projects-grid">
    @for (project of projects; track project.title; let i = $index) {
      <div class="project-card card reveal" #reveal [style.transition-delay]="(i * 0.15 + 0.2) + 's'">
        <div class="image-wrap">
          <img [src]="project.image" [alt]="project.title" loading="lazy" />
          <a [href]="project.github" target="_blank" rel="noopener" class="overlay">
            <span>View on GitHub →</span>
          </a>
        </div>
        <div class="info">
          <h2>{{ project.title }}</h2>
          <p>{{ project.description }}</p>
          <div class="tags">
            @for (tag of project.tags; track tag) {
              <span class="tag">{{ tag }}</span>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>
