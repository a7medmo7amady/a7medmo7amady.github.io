<div class="section page-enter">
  <div class="page-hello"><span class="ph-prompt">&gt;</span><span class="ph-text">hello, let's talk</span><span class="ph-cursor"></span></div>

  <p class="eyebrow reveal" #reveal>Contact</p>
  <h1 class="section-title reveal delay-1" #reveal>Get In <span class="gradient-text">Touch</span></h1>
  <p class="section-sub reveal delay-2" #reveal>Feel free to reach out anytime</p>

  <div class="reveal delay-3" #reveal>
    <app-terminal
      title="~/contact"
      prompt="ahmad@contact:~$"
      [defaultCommand]="defaultCommand"
      [suggestions]="suggestions"
      [processCommand]="processCommand.bind(this)"
    />
  </div>
</div>
